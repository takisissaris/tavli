<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Τάβλι · Πόρτες</title>
<style>
  :root {
    --wood-dark:  #241610;
    --wood-mid:   #3a2416;
    --wood-edge:  #6b4a2e;
    --felt:       #33463a;
    --felt-dark:  #283a30;
    --pt-light:   #e6d2ab;
    --pt-light-2: #cdb488;
    --pt-dark:    #a9603a;
    --pt-dark-2:  #8a4a29;
    --ivory:      #f2e6cd;
    --ivory-edge: #c7ad82;
    --ivory-hi:   #fffaf0;
    --horn:       #47331f;
    --horn-2:     #1b110a;
    --horn-hi:    #6d4e30;
    --ink:        #efe4cc;
    --ink-dim:    #a58b62;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    min-height: 100%;
  }

  body {
    background:
      radial-gradient(120% 90% at 50% 0%, #241b15 0%, #17110d 60%, #100b08 100%);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: safe center;
    gap: clamp(10px, 2.5vh, 24px);
    padding: clamp(12px, 3vw, 28px);
    min-height: 100vh;
    min-height: 100dvh;
  }

  /* ---------- Header ---------- */
  .masthead {
    text-align: center;
    line-height: 1;
  }
  .masthead .eyebrow {
    font-family: "Palatino Linotype", "Book Antiqua", Palatino, Georgia, serif;
    letter-spacing: 0.55em;
    text-indent: 0.55em;
    font-size: clamp(11px, 1.6vw, 14px);
    color: var(--ink-dim);
    text-transform: uppercase;
  }
  .masthead .title {
    font-family: "Palatino Linotype", "Book Antiqua", Palatino, Georgia, serif;
    font-size: clamp(30px, 6vw, 52px);
    font-weight: 600;
    margin-top: 0.18em;
    color: var(--ivory);
    text-shadow: 0 1px 0 #000, 0 0 22px rgba(226,196,140,0.12);
  }
  .masthead .romanization {
    font-size: clamp(10px, 1.4vw, 13px);
    letter-spacing: 0.32em;
    text-indent: 0.32em;
    color: var(--ink-dim);
    margin-top: 0.5em;
    text-transform: uppercase;
  }

  /* ---------- Screens ---------- */
  .screen {
    display: none;
    flex-direction: column;
    align-items: center;
    gap: clamp(10px, 2.5vh, 24px);
    width: 100%;
  }
  .screen.active { display: flex; }

  /* ---------- Menu ---------- */
  .menu-list {
    display: flex;
    flex-direction: column;
    gap: clamp(10px, 1.6vh, 14px);
    width: 100%;
    max-width: 520px;
  }
  .menu-card {
    display: flex;
    align-items: center;
    gap: 16px;
    width: 100%;
    text-align: left;
    padding: clamp(14px, 2.4vw, 18px) clamp(16px, 2.6vw, 20px);
    border-radius: 14px;
    border: 1px solid rgba(230,210,171,0.14);
    background: linear-gradient(150deg, #2c1d12, #211510);
    color: var(--ink);
    font-family: inherit;
    cursor: pointer;
    transition: transform 130ms ease, border-color 130ms ease, background 130ms ease;
  }
  .menu-card:hover:not([disabled]) {
    transform: translateY(-2px);
    border-color: rgba(230,210,171,0.4);
    background: linear-gradient(150deg, #34241688, #2a1c12);
  }
  .menu-card:focus-visible { outline: 3px solid #e6d2ab; outline-offset: 3px; }
  .menu-card[disabled] { cursor: default; opacity: 0.5; }
  .mc-greek {
    font-family: "Palatino Linotype", "Book Antiqua", Palatino, Georgia, serif;
    font-size: clamp(24px, 5vw, 32px);
    color: var(--ivory);
    min-width: 2.6em;
    line-height: 1;
  }
  .mc-body { flex: 1; }
  .mc-name {
    font-size: clamp(13px, 2vw, 15px);
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--ink-dim);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .mc-desc { font-size: clamp(13px, 2vw, 15px); margin-top: 4px; color: var(--ink); opacity: 0.82; }
  .soon {
    font-size: 10px;
    letter-spacing: 0.14em;
    padding: 2px 7px;
    border-radius: 999px;
    border: 1px solid rgba(230,210,171,0.35);
    color: var(--ink-dim);
  }
  .mc-go { font-size: 22px; color: var(--ink-dim); }
  .menu-card[disabled] .mc-go { display: none; }

  /* ---------- Game top bar & score ---------- */
  .topbar {
    width: 100%;
    max-width: 900px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 0 2px;
  }
  .link {
    background: none;
    border: none;
    color: var(--ink-dim);
    font-family: inherit;
    font-size: clamp(13px, 1.8vw, 15px);
    letter-spacing: 0.02em;
    cursor: pointer;
    padding: 4px 2px;
  }
  .link:hover:not(:disabled) { color: var(--ink); }
  .link:focus-visible { outline: 2px solid #e6d2ab; outline-offset: 3px; border-radius: 4px; }
  .link:disabled { opacity: 0.35; cursor: default; }
  .game-name {
    flex: 1;
    text-align: center;
    font-family: "Palatino Linotype", "Book Antiqua", Palatino, Georgia, serif;
    font-size: clamp(18px, 3.2vw, 26px);
    color: var(--ivory);
  }
  .score { display: flex; gap: 12px; align-items: center; }
  .score .side {
    display: flex;
    align-items: center;
    gap: 6px;
    font-variant-numeric: tabular-nums;
    font-size: clamp(14px, 2vw, 16px);
    color: var(--ink);
  }
  .dot {
    width: 0.9em; height: 0.9em; border-radius: 50%;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,0.3);
    flex-shrink: 0;
  }
  .dot.w { background: radial-gradient(circle at 36% 30%, var(--ivory-hi), var(--ivory-edge)); }
  .dot.b { background: radial-gradient(circle at 36% 30%, var(--horn-hi), var(--horn-2)); }

  /* ---------- Board frame ---------- */
  .tavli {
    container-type: inline-size;
    width: 100%;
    max-width: min(900px, 72vh);
  }
  .frame {
    display: flex;
    gap: 1.6cqw;
    padding: 2.6cqw;
    border-radius: 2.4cqw;
    background:
      linear-gradient(150deg, var(--wood-mid), var(--wood-dark));
    box-shadow:
      inset 0 0 0 0.35cqw rgba(0,0,0,0.5),
      inset 0 0 2.4cqw rgba(0,0,0,0.55),
      0 1.2cqw 3.4cqw rgba(0,0,0,0.55),
      0 0 0 0.18cqw var(--wood-edge);
  }

  /* ---------- Play area ---------- */
  .play {
    flex: 1;
    aspect-ratio: 13 / 10;
    display: flex;
    flex-direction: column;
    background:
      radial-gradient(140% 120% at 50% 50%, var(--felt) 0%, var(--felt-dark) 100%);
    border-radius: 0.8cqw;
    box-shadow: inset 0 0 2.2cqw rgba(0,0,0,0.55);
    overflow: hidden;
    position: relative;
  }
  /* faint centre seam */
  .play::after {
    content: "";
    position: absolute;
    left: 0; right: 0; top: 50%;
    height: 0.25cqw;
    transform: translateY(-50%);
    background: rgba(0,0,0,0.28);
    pointer-events: none;
  }

  .half {
    flex: 1;
    display: flex;
  }
  .quad {
    flex: 6;
    display: flex;
  }
  .bar {
    flex: 1;
    background: linear-gradient(90deg, #1c110a, #33200f, #1c110a);
    box-shadow:
      inset 0.2cqw 0 0.4cqw rgba(0,0,0,0.5),
      inset -0.2cqw 0 0.4cqw rgba(0,0,0,0.5);
    position: relative;
    z-index: 3;
  }

  /* ---------- Points (triangles) ---------- */
  .point {
    container-type: inline-size;
    flex: 1;
    position: relative;
  }
  .point::before {
    content: "";
    position: absolute;
    inset: 0;
    z-index: 0;
  }
  .point.top::before    { clip-path: polygon(0 0, 100% 0, 50% 86%); }
  .point.bottom::before { clip-path: polygon(50% 14%, 0 100%, 100% 100%); }

  .point.light::before {
    background: linear-gradient(180deg, var(--pt-light) 0%, var(--pt-light-2) 100%);
  }
  .point.dark::before {
    background: linear-gradient(180deg, var(--pt-dark) 0%, var(--pt-dark-2) 100%);
  }
  .point.bottom.light::before {
    background: linear-gradient(0deg, var(--pt-light) 0%, var(--pt-light-2) 100%);
  }
  .point.bottom.dark::before {
    background: linear-gradient(0deg, var(--pt-dark) 0%, var(--pt-dark-2) 100%);
  }

  /* point number labels on the frame edge */
  .pip {
    position: absolute;
    left: 0; right: 0;
    text-align: center;
    font-size: 3.1cqw;
    font-variant-numeric: tabular-nums;
    color: var(--ink-dim);
    opacity: 0.55;
    z-index: 0;
  }
  .point.top .pip    { top: -4.6cqw; }
  .point.bottom .pip { bottom: -4.6cqw; }

  /* ---------- Checkers ---------- */
  .checker {
    position: absolute;
    left: 50%;
    width: 84cqw;
    aspect-ratio: 1;
    transform: translateX(-50%);
    border-radius: 50%;
    z-index: 1;
    display: grid;
    place-items: center;
    font-size: 30cqw;
    font-variant-numeric: tabular-nums;
    font-weight: 600;
  }
  .checker.w {
    background:
      radial-gradient(circle at 38% 30%, var(--ivory-hi) 0%, var(--ivory) 42%, var(--ivory-edge) 100%);
    box-shadow:
      inset 0 0 0 3cqw rgba(255,255,255,0.35),
      inset 0 0 0 6cqw rgba(150,120,70,0.20),
      0 0.8cqw 1.2cqw rgba(0,0,0,0.35);
    color: #5c4a2c;
  }
  .checker.b {
    background:
      radial-gradient(circle at 38% 30%, var(--horn-hi) 0%, var(--horn) 40%, var(--horn-2) 100%);
    box-shadow:
      inset 0 0 0 3cqw rgba(255,225,180,0.10),
      inset 0 0 0 6cqw rgba(0,0,0,0.28),
      0 0.8cqw 1.2cqw rgba(0,0,0,0.45);
    color: var(--ivory);
  }
  .point.top .checker    { top: 1cqw; }
  .point.bottom .checker { bottom: 1cqw; }

  /* ---------- Move interaction ---------- */
  .point.movable,
  .point.legal { cursor: pointer; }
  .point.legal::before { filter: brightness(1.3) saturate(1.15); }
  .point.selected .checker:last-of-type {
    filter: drop-shadow(0 0 2cqw rgba(245,225,170,0.95));
  }
  /* legal-move marker — a bold amber disc at the point's tip, drawn above checkers.
     NB: .point is a size container, so cqw here is % of the POINT width. */
  .target {
    position: absolute;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 62cqw;
    aspect-ratio: 1;
    border-radius: 50%;
    z-index: 60;
    pointer-events: none;
    background: radial-gradient(circle at 40% 34%, #ffd873 0%, #eda63c 58%, #c9822b 100%);
    box-shadow: 0 0 0 5cqw rgba(26,15,6,0.8),
                0 0 16cqw 4cqw rgba(240,190,90,0.85);
  }
  .point.top .target    { top: 72%; }
  .point.bottom .target { bottom: 72%; }

  /* checkers resting on the bar (bar is not a size container, so size vs. board) */
  .checker.onbar { width: 5.4cqw; font-size: 2.4cqw; }
  .bar.movable { cursor: pointer; }
  .bar.selected .checker:last-of-type {
    filter: drop-shadow(0 0 1.6cqw rgba(245,225,170,0.95));
  }

  /* ---------- Bear-off strip ---------- */
  /* A physical board needs the tray off to the side; a screen doesn't — the
     only fact that matters mid-game is the count. Compact chips instead of
     a full-width column give the board itself back that space to grow into,
     and double as the tap target for bearing a checker off. */
  .off-row {
    display: flex;
    justify-content: center;
    gap: 12px;
  }
  .off-chip {
    display: flex;
    align-items: center;
    gap: 7px;
    background: none;
    border: none;
    font-family: inherit;
    font-size: clamp(12px, 1.7vw, 14px);
    font-variant-numeric: tabular-nums;
    color: var(--ink-dim);
    padding: 5px 12px;
    border-radius: 999px;
    cursor: default;
  }
  .off-chip.legal {
    cursor: pointer;
    color: var(--ink);
    background: rgba(245, 225, 170, 0.12);
    box-shadow: inset 0 0 0 1px rgba(245, 225, 170, 0.4);
  }
  .off-chip.legal:hover { background: rgba(245, 225, 170, 0.2); }
  .off-chip.legal:focus-visible { outline: 2px solid #e6d2ab; outline-offset: 2px; }

  /* ---------- Caption ---------- */
  .caption {
    text-align: center;
    color: var(--ink-dim);
    font-size: clamp(12px, 1.7vw, 15px);
    letter-spacing: 0.02em;
    max-width: 40ch;
  }

  /* ---------- Build tag ---------- */
  .build-tag {
    position: fixed;
    right: 10px;
    bottom: 8px;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 11px;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.02em;
    color: var(--ink-dim);
    opacity: 0.4;
    text-decoration: none;
    z-index: 100;
    transition: opacity 120ms ease;
  }
  .build-tag:hover, .build-tag:focus-visible { opacity: 0.9; }

  /* ---------- Dice ---------- */
  .dice-layer {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 6;
  }
  .dice-row {
    position: absolute;
    left: 50%;
    transform: translate(-50%, -50%);
    display: flex;
    gap: 2.4cqw;
  }
  .dice-row.w { top: 67%; }   /* White's side (lower half) */
  .dice-row.b { top: 33%; }   /* Black's side (upper half) */
  .dice-row.rotated { top: 67%; }   /* board is spun for black's turn — dice move to the near half too */

  .die {
    width: 8.6cqw;
    aspect-ratio: 1;
    border-radius: 1.8cqw;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);
    padding: 1.3cqw;
    box-shadow: 0 0.9cqw 1.6cqw rgba(0,0,0,0.5);
  }
  .die.w {
    background: radial-gradient(circle at 34% 28%, var(--ivory-hi) 0%, var(--ivory) 45%, var(--ivory-edge) 100%);
  }
  .die.b {
    background: radial-gradient(circle at 34% 28%, var(--horn-hi) 0%, var(--horn) 42%, var(--horn-2) 100%);
  }
  .die .cell { display: grid; place-items: center; }
  .die .cell.on::after {
    content: "";
    width: 62%;
    aspect-ratio: 1;
    border-radius: 50%;
  }
  .die.w .cell.on::after {
    background: #3a2a18;
    box-shadow: inset 0 0.25cqw 0.4cqw rgba(0,0,0,0.55);
  }
  .die.b .cell.on::after {
    background: var(--ivory);
    box-shadow: inset 0 0.25cqw 0.4cqw rgba(0,0,0,0.35);
  }

  /* ---------- Controls ---------- */
  .controls {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: clamp(9px, 1.8vh, 15px);
    min-height: 92px;
    text-align: center;
  }
  .banner {
    margin: 0;
    font-family: "Palatino Linotype", "Book Antiqua", Palatino, Georgia, serif;
    font-size: clamp(15px, 2.4vw, 21px);
    letter-spacing: 0.01em;
    color: var(--ink);
  }
  .banner .who { font-weight: 600; }
  .banner .who.w { color: #f2e6cd; }
  .banner .who.b { color: #d79a6b; }
  .control-row {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .btn {
    font-family: inherit;
    font-size: clamp(15px, 2.2vw, 18px);
    font-weight: 600;
    letter-spacing: 0.02em;
    padding: 0.72em 1.7em;
    border: none;
    border-radius: 999px;
    cursor: pointer;
    color: #3a2a18;
    background: linear-gradient(180deg, #f5ead2 0%, #d8c096 100%);
    box-shadow: 0 2px 0 #a4854f, 0 6px 15px rgba(0,0,0,0.42);
    transition: transform 120ms ease, box-shadow 120ms ease, filter 120ms ease;
  }
  .btn:hover:not(:disabled) { filter: brightness(1.04); }
  .btn:active:not(:disabled) {
    transform: translateY(2px);
    box-shadow: 0 0 0 #a4854f, 0 3px 9px rgba(0,0,0,0.42);
  }
  .btn:focus-visible { outline: 3px solid #e6d2ab; outline-offset: 3px; }
  .btn:disabled {
    cursor: default;
    opacity: 0.4;
    box-shadow: 0 2px 0 #a4854f, 0 3px 8px rgba(0,0,0,0.3);
  }

  /* load-in */
  @media (prefers-reduced-motion: no-preference) {
    .die.tumble { animation: tumble 460ms cubic-bezier(0.2, 0.7, 0.3, 1) both; }
    @keyframes tumble {
      0%   { opacity: 0; transform: rotate(-38deg) scale(0.55); }
      62%  { opacity: 1; transform: rotate(7deg) scale(1.06); }
      100% { transform: none; }
    }
    .target { animation: pulse 1.4s ease-in-out infinite; }
    @keyframes pulse {
      0%, 100% { opacity: 0.88; transform: translate(-50%, -50%) scale(0.9); }
      50%      { opacity: 1;    transform: translate(-50%, -50%) scale(1.08); }
    }
    .tavli { animation: rise 620ms cubic-bezier(0.22, 0.61, 0.36, 1) both; }
    @keyframes rise {
      from { opacity: 0; transform: translateY(10px) scale(0.992); }
      to   { opacity: 1; transform: none; }
    }
    /* Plakoto: a one-shot glow on the instant a checker gets pinned — not a
       lasting marker (the checker settles back to looking perfectly plain),
       just a beat of feedback for the moment itself. drop-shadow rather than
       box-shadow so it doesn't fight the checker's own glossy inset shadows;
       transform keeps the base translateX(-50%) centering intact throughout. */
    .checker.just-pinned { animation: pinned-flash 900ms ease-out both; }
    @keyframes pinned-flash {
      0% {
        transform: translateX(-50%) scale(1);
        filter: drop-shadow(0 0 0 rgba(20,12,6,0)) drop-shadow(0 0 0 rgba(245,195,80,0));
      }
      30% {
        transform: translateX(-50%) scale(1.18);
        filter: drop-shadow(0 0 1.5cqw rgba(20,12,6,0.55)) drop-shadow(0 0 6cqw rgba(245,195,80,1));
      }
      100% {
        transform: translateX(-50%) scale(1);
        filter: drop-shadow(0 0 0 rgba(20,12,6,0)) drop-shadow(0 0 0 rgba(245,195,80,0));
      }
    }
  }
</style>
</head>
<body>
  <!-- Menu -->
  <section id="menu" class="screen">
    <header class="masthead">
      <div class="eyebrow">Παίξε</div>
      <h1 class="title">Τάβλι</h1>
      <div class="romanization">Tavli — three games, one board</div>
    </header>
    <div class="menu-list" id="menuList"></div>
  </section>

  <!-- Opponent picker -->
  <section id="opponent" class="screen">
    <div class="topbar">
      <button class="link" id="opponentBack" type="button">‹ Back</button>
      <div class="game-name" id="opponentTitle"></div>
      <div class="score"></div>
    </div>
    <div class="menu-list" id="opponentList"></div>
  </section>

  <!-- Game -->
  <section id="game" class="screen">
    <div class="topbar">
      <button class="link" id="toMenu" type="button">‹ Menu</button>
      <div class="game-name" id="gameName"></div>
      <div class="score" id="score"></div>
    </div>

    <div class="off-row" id="offRow"></div>

    <div class="tavli">
      <div class="frame">
        <div class="play" id="play"></div>
      </div>
    </div>

    <div class="controls">
      <p class="banner" id="banner">Roll for the first move.</p>
      <div class="control-row">
        <button class="link" id="undo" type="button" hidden>Undo</button>
        <button class="btn" id="action" type="button">Roll</button>
      </div>
    </div>
  </section>

  <!-- Stamped with the deployed commit's short SHA by the Pages workflow
       (see .github/workflows/pages.yml) so it's obvious which build is
       live. Left as the placeholder when opened straight from a checkout. -->
  <a class="build-tag" id="buildTag" href="#" target="_blank" rel="noopener">__BUILD_SHA__</a>

<script>
  // ---- Board state (absolute points 1..24) ----
  // White (ivory) runs 24 -> 1, home 1-6.  Black (horn) runs 1 -> 24, home 19-24.
  function emptyPoints() {
    const p = {};
    for (let i = 1; i <= 24; i++) p[i] = { color: null, count: 0, pinned: null };
    return p;
  }

  const state = {
    points: emptyPoints(),
    bar: { w: 0, b: 0 },
    off: { w: 0, b: 0 },
    phase: 'openRoll',   // openRoll -> awaitRoll <-> rolled
    current: null,       // 'w' | 'b'
    dice: [],            // dice available this turn
    opening: null,       // { w, b } opening-roll values
    openTie: false,
    openingWin: false,   // true on the opening winner's first turn
    selected: null,      // origin point currently picked up
    legal: [],           // legal destination points for the selection
    justRolled: false,   // animate dice only on the roll itself
    justPinned: null,    // point number to flash once, right after a Plakoto pin
    result: null,        // { winner, kind, pts } once a game ends
    screen: 'menu',      // 'menu' | 'opponent' | 'game'
    variant: null,       // active game id
    pendingVariant: null, // variant picked on the menu, awaiting an opponent choice
    opponent: 'human',   // 'human' | an OPPONENTS bot id — the bot always plays black
    score: { w: 0, b: 0 }, // running match tally
    history: [],         // snapshots to undo back through, cleared each turn
  };

  const PORTES_START = {
    1:  ['b', 2],
    6:  ['w', 5],
    8:  ['w', 3],
    12: ['b', 5],
    13: ['w', 5],
    17: ['b', 3],
    19: ['b', 5],
    24: ['w', 2],
  };

  // Registry of the three tavli games.
  const VARIANTS = {
    portes:  { id: 'portes',  el: 'Πόρτες',  en: 'Portes',  start: PORTES_START,
               desc: 'The classic race — hit a lone checker to the bar.', ready: true },
    plakoto: { id: 'plakoto', el: 'Πλακωτό', en: 'Plakoto',
               start: { 24: ['w', 15], 1: ['b', 15] },
               desc: 'Pin the opponent instead of hitting.', ready: true },
    fevga:   { id: 'fevga',   el: 'Φέβγα',   en: 'Fevga',
               start: { 24: ['w', 15], 12: ['b', 15] },
               desc: 'Same direction, no contact — a pure race.', ready: true },
  };

  // Registry of opponents. 'human' is local pass-and-play; the bots always
  // play Black. Kept as a registry (like VARIANTS) so more difficulty levels
  // can be dropped in later without touching the picker screen or startGame.
  const OPPONENTS = {
    human:  { id: 'human',  el: 'Δύο παίκτες', en: 'Pass & Play',
              desc: 'Two players share this device.', ready: true },
    random: { id: 'random', el: 'Τυχαίο',       en: 'Random Bot',
              desc: 'Plays any legal move at random — no strategy.', ready: true },
    hitter: { id: 'hitter', el: 'Επιθετικό',    en: 'Hitter Bot',
              desc: 'Random, but grabs a hit or pin whenever one is on offer.', ready: true },
    safe:   { id: 'safe',   el: 'Προσεκτικό',    en: 'Safe Bot',
              desc: 'Random, but avoids leaving a checker alone on a point.', ready: true },
  };

  function loadStart() {
    state.points = emptyPoints();
    const start = VARIANTS[state.variant].start;
    for (const [pt, [c, n]] of Object.entries(start)) state.points[pt] = { color: c, count: n, pinned: null };
    state.bar = { w: 0, b: 0 };
    state.off = { w: 0, b: 0 };
  }

  // ---- Visual layout ----
  // Top row (left -> right):    13..18 | bar | 19..24
  // Bottom row (left -> right): 12..7  | bar |  6..1
  const TOP_LEFT     = [13, 14, 15, 16, 17, 18];
  const TOP_RIGHT    = [19, 20, 21, 22, 23, 24];
  const BOTTOM_LEFT  = [12, 11, 10, 9, 8, 7];
  const BOTTOM_RIGHT = [6, 5, 4, 3, 2, 1];

  // Point N's diametrically opposite point (13<->1, 24<->12, ...). Rendering a
  // quadrant's points through this — rather than literally CSS-rotating the
  // board — spins the whole layout 180° for pass-and-play while point-number
  // labels and checker counts stay upright automatically.
  const opp = (n) => n <= 12 ? n + 12 : n - 12;

  // Only pass-and-play hands the physical device to the other side of the
  // table. Against a bot the human is always the one watching, so keep their
  // orientation fixed rather than spinning the board while the bot "thinks".
  const shouldRotate = () => state.current === 'b' && state.opponent === 'human';

  function buildQuad(pointNums, row, colOffset, turnMax) {
    const quad = document.createElement('div');
    quad.className = 'quad';
    pointNums.forEach((num, i) => {
      const col = colOffset + i;
      // alternate shade; offset the bottom row so verticals contrast
      let shade;
      if (row === 'top') shade = (col % 2 === 0) ? 'light' : 'dark';
      else               shade = (col % 2 === 0) ? 'dark'  : 'light';
      quad.appendChild(buildPoint(num, row, shade, turnMax));
    });
    return quad;
  }

  function buildPoint(num, row, shade, turnMax) {
    const el = document.createElement('div');
    el.className = `point ${row} ${shade}`;
    el.dataset.point = num;

    const cell = state.points[num];
    const movePhase = state.phase === 'rolled' && !isBotTurn();

    if (num === state.selected) el.classList.add('selected');
    if (state.legal.includes(num)) el.classList.add('legal');
    if (movePhase && state.selected === null &&
        cell.color === state.current && cell.count > 0 &&
        maximalDestinations(num, turnMax).length) {
      el.classList.add('movable');
    }

    const pip = document.createElement('div');
    pip.className = 'pip';
    pip.textContent = num;
    el.appendChild(pip);

    renderCheckers(el, row, cell, num === state.justPinned);

    if (state.legal.includes(num)) {
      const t = document.createElement('div');
      t.className = 'target';
      el.appendChild(t);
    }

    if (movePhase) el.addEventListener('click', () => onPointTap(num));
    return el;
  }

  function buildBar(row, rotated) {
    const bar = document.createElement('div');
    bar.className = 'bar';
    const top = row === 'top';
    const color = rotated ? (top ? 'w' : 'b') : (top ? 'b' : 'w');
    const n = state.bar[color];
    const active = state.phase === 'rolled' && !isBotTurn() && state.current === color && n > 0;

    if (active) {
      bar.classList.add('movable');
      if (state.selected === 'bar') bar.classList.add('selected');
      bar.addEventListener('click', onBarTap);
    }
    if (n > 0) {
      const USABLE = 30, DIAM = 5.4, base = 6;
      const step = n > 1 ? Math.min(base, (USABLE - DIAM) / (n - 1)) : 0;
      const overlapping = step < DIAM * 0.7;
      for (let i = 0; i < n; i++) {
        const c = document.createElement('div');
        c.className = `checker ${color} onbar`;
        const off = `${6 + i * step}cqw`;
        if (row === 'top') c.style.top = off; else c.style.bottom = off;
        c.style.zIndex = 1 + i;
        if (overlapping && i === n - 1) c.textContent = n;
        bar.appendChild(c);
      }
    }
    return bar;
  }

  function onBarTap() {
    if (state.phase !== 'rolled') return;
    if (state.bar[state.current] > 0) selectOrigin('bar');
  }

  // Plakoto: a pinned checker isn't drawn with any special marker — like on
  // a physical board, it's just placed first, and the covering checkers
  // stack on top of it in order, so it naturally peeks out from underneath.
  // The one exception is `justPinned`: a brief one-shot flash on the instant
  // it happens, not a lasting marker, just so the moment itself reads clearly.
  function renderCheckers(pointEl, row, cell, justPinned) {
    const { color, count, pinned } = cell;
    const items = pinned ? [pinned, ...Array(count).fill(color)] : Array(count).fill(color);
    if (items.length === 0) return;
    if (pinned) pointEl.title = `${NAME[pinned]} checker pinned here`;

    // usable length along the point, expressed in cqw (relative to point width)
    const USABLE = 430;   // ~ point height in cqw
    const DIAM   = 84;
    const baseStep = 88;
    const step = items.length > 1
      ? Math.min(baseStep, (USABLE - DIAM) / (items.length - 1))
      : 0;

    const overlapping = step < DIAM * 0.7;

    items.forEach((itemColor, i) => {
      const c = document.createElement('div');
      c.className = `checker ${itemColor}`;
      if (justPinned && pinned && i === 0) c.classList.add('just-pinned');
      const offset = `${1 + i * step}cqw`;
      if (row === 'top') c.style.top = offset;
      else               c.style.bottom = offset;
      c.style.zIndex = 1 + i;
      // when stacked tightly, only label the outermost checker with the
      // owner's own count (the pinned checker underneath isn't part of it)
      if (overlapping && i === items.length - 1) c.textContent = count;
      pointEl.appendChild(c);
    });
  }

  function render() {
    const play = document.getElementById('play');
    play.innerHTML = '';

    // Computed once per render (not once per point) — `movable` highlighting
    // for all 24 points shares this same turn-wide maximal-dice-usage figure.
    const turnMax = (state.phase === 'rolled' && state.selected === null && state.current)
      ? maxDiceUsable(state, state.dice, state.current)
      : undefined;

    // Pass-and-play: spin the whole board 180° on black's turn so whoever is
    // about to move sees their own home board nearest them, matching how a
    // physical board would look after being turned around the table.
    const rotated = shouldRotate();
    const quadPts = (arr) => rotated ? arr.map(opp) : arr;

    const top = document.createElement('div');
    top.className = 'half top';
    top.appendChild(buildQuad(quadPts(TOP_LEFT), 'top', 0, turnMax));
    top.appendChild(buildBar('top', rotated));
    top.appendChild(buildQuad(quadPts(TOP_RIGHT), 'top', 6, turnMax));

    const bottom = document.createElement('div');
    bottom.className = 'half bottom';
    bottom.appendChild(buildQuad(quadPts(BOTTOM_LEFT), 'bottom', 0, turnMax));
    bottom.appendChild(buildBar('bottom', rotated));
    bottom.appendChild(buildQuad(quadPts(BOTTOM_RIGHT), 'bottom', 6, turnMax));

    play.appendChild(top);
    play.appendChild(bottom);

    const diceLayer = document.createElement('div');
    diceLayer.className = 'dice-layer';
    diceLayer.id = 'diceLayer';
    play.appendChild(diceLayer);

    state.justPinned = null;
  }

  // ---- Dice ----
  const PIPS = {
    1: [4],
    2: [0, 8],
    3: [0, 4, 8],
    4: [0, 2, 6, 8],
    5: [0, 2, 4, 6, 8],
    6: [0, 2, 3, 5, 6, 8],
  };
  const rollDie = () => 1 + Math.floor(Math.random() * 6);
  const other = (c) => (c === 'w' ? 'b' : 'w');
  const NAME = { w: 'White', b: 'Black' };

  function makeDie(value, color, animate) {
    const die = document.createElement('div');
    die.className = `die ${color}` + (animate ? ' tumble' : '');
    const on = PIPS[value];
    for (let i = 0; i < 9; i++) {
      const cell = document.createElement('div');
      cell.className = on.includes(i) ? 'cell on' : 'cell';
      die.appendChild(cell);
    }
    return die;
  }

  function diceRow(side, values, animate, rotated) {
    const row = document.createElement('div');
    row.className = `dice-row ${side}` + (rotated ? ' rotated' : '');
    values.forEach((v) => row.appendChild(makeDie(v, side, animate)));
    return row;
  }

  function renderDice() {
    const layer = document.getElementById('diceLayer');
    layer.innerHTML = '';
    const animate = state.justRolled;

    if (state.phase === 'openRoll' && state.opening) {
      layer.appendChild(diceRow('w', [state.opening.w], animate));
      layer.appendChild(diceRow('b', [state.opening.b], animate));
    } else if (state.phase === 'rolled') {
      layer.appendChild(diceRow(state.current, state.dice, animate, shouldRotate()));
    }
    state.justRolled = false;
  }

  // ---- Move rules ----
  const uniq = (dice) => [...new Set(dice)];
  function removeOne(dice, value) {
    const copy = dice.slice();
    const idx = copy.indexOf(value);
    if (idx !== -1) copy.splice(idx, 1);
    return copy;
  }
  function clonePos(pos) {
    const points = {};
    for (let p = 1; p <= 24; p++) {
      const c = pos.points[p];
      points[p] = { color: c.color, count: c.count, pinned: c.pinned };
    }
    return { points, bar: { ...pos.bar } };
  }

  // White always runs 24 -> 1, home 1-6, in every variant. Black runs 1 -> 24,
  // home 19-24 in Portes/Plakoto (contact games); in Fevga black instead runs
  // the *same* rotational direction as white (decreasing, wrapping 1 -> 24),
  // starting from 12 and homing in 13-18 — so the two races run in parallel
  // rather than meeting head-on.
  function homeRange(color) {
    if (color === 'w') return [1, 6];
    return state.variant === 'fevga' ? [13, 18] : [19, 24];
  }
  function distToOff(origin, color) {
    if (color === 'w') return origin;
    return state.variant === 'fevga' ? origin - 12 : 25 - origin;
  }

  // The functions below take an explicit `pos` ({points, bar}) so the
  // maximal-dice-usage search further down can run them against disposable
  // simulated positions; each has a thin live wrapper bound to `state`.
  function isBlockedAt(pos, dest, color) {
    const c = pos.points[dest];
    if (c.color !== other(color)) return false;
    // Fevga: no hitting, no pinning — a single checker blocks the point outright.
    if (state.variant === 'fevga') return c.count >= 1;
    // Plakoto: a point that's already pinning someone is off-limits to further
    // contact — the data model only tracks one trapped checker per point, and
    // landing there to pin the (lone) covering checker would silently erase
    // whoever is already trapped underneath it.
    if (state.variant === 'plakoto' && c.pinned) return true;
    return c.count >= 2;   // a lone blot never blocks — Portes hits it, Plakoto pins it
  }
  function isBlocked(dest, color) { return isBlockedAt(state, dest, color); }

  function landableAt(pos, dest, color) {
    if (dest < 1 || dest > 24) return false;   // bearing off arrives in step 5
    return !isBlockedAt(pos, dest, color);     // a lone opponent blot can be hit or pinned
  }
  function landable(dest, color) { return landableAt(state, dest, color); }

  function destFor(origin, die, color) {
    if (color === 'w') return origin - die;
    if (state.variant === 'fevga') { const d = origin - die; return d < 1 ? d + 24 : d; }
    return origin + die;
  }
  const entryFor = (die, color) => color === 'w' ? 25 - die : die;

  function canBearOffAt(pos, color) {
    if (pos.bar[color] > 0) return false;
    const [lo, hi] = homeRange(color);
    // A checker pinned outside home is still stuck there — it hasn't come home either.
    for (let p = 1; p <= 24; p++) {
      if (p >= lo && p <= hi) continue;
      const c = pos.points[p];
      if (c.color === color || c.pinned === color) return false;
    }
    return true;
  }
  function canBearOff(color) { return canBearOffAt(state, color); }

  function farthestDistAt(pos, color) {
    const [lo, hi] = homeRange(color);
    let far = 0;
    for (let p = lo; p <= hi; p++) if (pos.points[p].color === color) far = Math.max(far, distToOff(p, color));
    return far;
  }
  function farthestDist(color) { return farthestDistAt(state, color); }

  // The die needed to bear a checker off this point, or null if not permitted.
  // Exact distance always works; a larger die works only from the farthest checker.
  function bearOffDieForAt(pos, dice, origin, color) {
    if (typeof origin !== 'number' || !canBearOffAt(pos, color)) return null;
    const cell = pos.points[origin];
    if (cell.color !== color || cell.count === 0) return null;
    const dist = distToOff(origin, color);
    const far = farthestDistAt(pos, color);
    const cands = uniq(dice).filter((d) => d === dist || (d > dist && dist === far));
    return cands.length ? Math.min(...cands) : null;
  }
  function bearOffDieFor(origin, color) { return bearOffDieForAt(state, state.dice, origin, color); }

  // Fevga: a player may never close every point of their own home board
  // while the opponent still has a checker that hasn't yet crossed it — a
  // single checker is enough to close a point there, so a full six-point
  // wall would trap that checker permanently with no way to ever pass.
  // Checked per candidate move rather than at the end of a full turn:
  // once a checker enters home it can only advance deeper or bear off,
  // never leave again, so a closure created partway through a turn can
  // only stay closed or open further from there — never re-close later.
  function closesOutOpponent(pos, origin, dest, color) {
    if (state.variant !== 'fevga' || dest === 'off') return false;
    const clone = clonePos(pos);
    applyMoveAt(clone, origin, dest, color);
    const [lo, hi] = homeRange(color);
    for (let p = lo; p <= hi; p++) {
      if (clone.points[p].color !== color || clone.points[p].count === 0) return false;
    }
    const opp = other(color);
    for (let i = 1; i <= 6; i++) {
      const p = hi + i > 24 ? hi + i - 24 : hi + i;
      if (clone.points[p].color === opp) return true;
    }
    return false;
  }

  function legalFromAt(pos, dice, color, origin) {
    const seen = new Set();
    const moves = [];
    const dvals = uniq(dice);

    // On the bar: only re-entry is allowed, nothing else moves.
    if (pos.bar[color] > 0) {
      if (origin !== 'bar') return [];
      for (const die of dvals) {
        const dest = entryFor(die, color);
        if (landableAt(pos, dest, color) && !seen.has(dest)) {
          seen.add(dest);
          moves.push({ dest, die });
        }
      }
      return moves;
    }

    if (origin === 'bar') return [];
    const cell = pos.points[origin];
    if (cell.color !== color || cell.count === 0) return [];
    for (const die of dvals) {
      const dest = destFor(origin, die, color);
      if (landableAt(pos, dest, color) && !seen.has(dest) && !closesOutOpponent(pos, origin, dest, color)) {
        seen.add(dest);
        moves.push({ dest, die });
      }
    }
    const offDie = bearOffDieForAt(pos, dice, origin, color);
    if (offDie !== null) moves.push({ dest: 'off', die: offDie });
    return moves;
  }
  function legalFrom(origin) {
    if (!state.current) return [];
    return legalFromAt(state, state.dice, state.current, origin);
  }

  // A point's covering stack just emptied. If it was pinning a lone enemy
  // checker underneath, that checker is freed back into play; otherwise the
  // point simply goes empty. (Declared here, ahead of applyMoveAt below,
  // which — like performMove — relies on it.)
  function freeOrClear(cell) {
    if (cell.pinned) {
      cell.color = cell.pinned;
      cell.count = 1;
      cell.pinned = null;
    } else {
      cell.color = null;
    }
  }

  // Mutates `pos` to apply one move, mirroring performMove's board logic
  // exactly (minus dice/off-tray/scoring bookkeeping, which callers handle).
  function applyMoveAt(pos, origin, dest, color) {
    if (dest === 'off') {
      const from = pos.points[origin];
      from.count -= 1;
      if (from.count === 0) freeOrClear(from);
      return;
    }
    if (origin === 'bar') {
      pos.bar[color] -= 1;
    } else {
      const from = pos.points[origin];
      from.count -= 1;
      if (from.count === 0) freeOrClear(from);
    }
    const to = pos.points[dest];
    if (to.color === other(color) && to.count === 1) {
      if (state.variant === 'plakoto') {
        to.pinned = to.color;
      } else {
        pos.bar[other(color)] += 1;
      }
      to.color = color;
      to.count = 1;
    } else if (to.count === 0) {
      to.color = color;
      to.count = 1;
    } else {
      to.count += 1;
    }
  }

  function movableOrigins(pos, color) {
    if (pos.bar[color] > 0) return ['bar'];
    const origins = [];
    for (let p = 1; p <= 24; p++) if (pos.points[p].color === color && pos.points[p].count > 0) origins.push(p);
    return origins;
  }

  // ---- Maximal dice usage ----
  // Tavli requires a player to use as many dice as any legal sequence
  // allows, and — when only one die of a non-double roll can be played at
  // all — the larger one if it's playable. Both need a lookahead: simulate
  // candidate moves on a disposable copy of the board and see how many more
  // dice a sequence can still use from there.
  function maxDiceUsable(pos, dice, color) {
    if (dice.length === 0) return 0;
    let best = 0;
    for (const origin of movableOrigins(pos, color)) {
      for (const mv of legalFromAt(pos, dice, color, origin)) {
        const clone = clonePos(pos);
        applyMoveAt(clone, origin, mv.dest, color);
        const sub = 1 + maxDiceUsable(clone, removeOne(dice, mv.die), color);
        if (sub > best) best = sub;
      }
    }
    return best;
  }
  function anyOriginCanPlayDie(pos, dice, color, die) {
    return movableOrigins(pos, color).some((o) => legalFromAt(pos, dice, color, o).some((m) => m.die === die));
  }
  // Destinations from `origin` that keep this turn's dice usage at its
  // achievable maximum — the subset of legalFrom(origin) actually allowed.
  // `knownMax`, when supplied, skips recomputing the (shared) turn maximum.
  function maximalDestinations(origin, knownMax) {
    const color = state.current;
    const dice = state.dice;
    const candidates = legalFrom(origin);
    if (candidates.length === 0) return [];

    const overallMax = knownMax !== undefined ? knownMax : maxDiceUsable(state, dice, color);
    if (overallMax === 0) return [];

    // "Play the bigger die" tie-break: only relevant before either die of a
    // plain (non-double) roll has been used, when just one die can be played.
    let forcedDie = null;
    if (overallMax === 1 && dice.length === 2 && dice[0] !== dice[1]) {
      const big = Math.max(dice[0], dice[1]);
      if (anyOriginCanPlayDie(state, dice, color, big)) forcedDie = big;
    }

    return candidates
      .filter((mv) => {
        if (forcedDie !== null && mv.die !== forcedDie) return false;
        const clone = clonePos(state);
        applyMoveAt(clone, origin, mv.dest, color);
        return 1 + maxDiceUsable(clone, removeOne(dice, mv.die), color) === overallMax;
      })
      .map((mv) => mv.dest);
  }

  function hasAnyLegalMove(color) {
    return maxDiceUsable(state, state.dice, color) > 0;
  }

  // ---- Selection & movement ----
  function onPointTap(num) {
    if (state.phase !== 'rolled') return;
    const cell = state.points[num];
    const mine = cell.color === state.current && cell.count > 0;

    if (state.selected === null) {
      if (mine && maximalDestinations(num).length) selectOrigin(num);
      return;
    }
    if (state.legal.includes(num)) {
      performMove(state.selected, num);
    } else if (num === state.selected) {
      clearSelection(); refresh();
    } else if (mine && maximalDestinations(num).length) {
      selectOrigin(num);
    } else {
      clearSelection(); refresh();
    }
  }

  function selectOrigin(num) {
    state.selected = num;
    state.legal = maximalDestinations(num);
    refresh();
  }

  function clearSelection() {
    state.selected = null;
    state.legal = [];
  }

  function performMove(origin, dest) {
    pushHistory();
    const color = state.current;

    if (dest === 'off') {
      const die = bearOffDieFor(origin, color);
      const idx = state.dice.indexOf(die);
      if (idx !== -1) state.dice.splice(idx, 1);
      applyMoveAt(state, origin, dest, color);
      state.off[color] += 1;
      state.openingWin = false;
      state.justRolled = false;
      state.justPinned = null;
      clearSelection();
      if (state.off[color] === 15) { endGame(color); return; }
      refresh();
      return;
    }

    let die;
    if (origin === 'bar') {
      die = color === 'w' ? 25 - dest : dest;
    } else if (color === 'w') {
      die = origin - dest;
    } else if (state.variant === 'fevga') {
      const raw = origin - dest;
      die = raw > 0 ? raw : raw + 24;
    } else {
      die = dest - origin;
    }

    const idx = state.dice.indexOf(die);
    if (idx !== -1) state.dice.splice(idx, 1);

    // Same landing condition applyMoveAt uses to decide whether to pin —
    // checked here, before the mutation, so we know whether to flash it.
    const to = state.points[dest];
    const willPin = state.variant === 'plakoto' && to.color === other(color) && to.count === 1;

    applyMoveAt(state, origin, dest, color);

    state.openingWin = false;
    state.justRolled = false;
    state.justPinned = willPin ? dest : null;
    clearSelection();
    refresh();
  }

  // ---- Controls / banner ----
  function who(color) {
    return `<span class="who ${color}">${NAME[color]}</span>`;
  }

  function renderControls() {
    const banner = document.getElementById('banner');
    const action = document.getElementById('action');
    const botTurn = isBotTurn();

    let text = '';
    let label = '';
    let handler = null;
    let disabled = false;

    switch (state.phase) {
      case 'openRoll':
        text = state.openTie
          ? `A tie at ${state.opening.w} apiece — roll again.`
          : 'Roll for the first move.';
        label = state.openTie ? 'Roll again' : 'Roll';
        handler = openingRoll;
        break;
      case 'awaitRoll':
        text = `${who(state.current)} to roll.`;
        label = 'Roll';
        handler = turnRoll;
        break;
      case 'rolled': {
        const left = state.dice;
        const onBar = state.bar[state.current] > 0;
        const diceTxt = left.length === 4 ? `double ${left[0]}s` : left.join(' &amp; ');
        if (left.length === 0) {
          text = `${who(state.current)} — no dice left. Pass the device.`;
        } else if (onBar && !hasAnyLegalMove(state.current)) {
          text = `${who(state.current)} is stuck on the bar — pass the device.`;
        } else if (onBar) {
          text = `${who(state.current)} — enter from the bar (${diceTxt}).`;
        } else if (!hasAnyLegalMove(state.current)) {
          text = `${who(state.current)} has no legal move. Pass the device.`;
        } else if (state.openingWin) {
          text = `${who(state.current)} wins the opening — plays ${left.join(' &amp; ')}.`;
        } else {
          text = `${who(state.current)} to move — ${diceTxt}.`;
        }
        label = 'Pass device';
        handler = passDevice;
        // Can't skip a turn early — the pass button only opens up once the
        // dice are spent or genuinely no legal move remains.
        disabled = left.length > 0 && hasAnyLegalMove(state.current);
        break;
      }
      case 'gameover': {
        const { winner, kind, pts } = state.result;
        const verb = kind === 'single' ? 'wins' : `wins a ${kind}`;
        text = `${who(winner)} ${verb} — ${pts} point${pts > 1 ? 's' : ''}.`;
        label = 'Play again';
        handler = newGame;
        break;
      }
    }

    // The bot drives itself via the AI turn scheduler — nothing here is the
    // human's to click, so replace the banner and hide the controls rather
    // than leave a button sitting there disabled with no clear reason why.
    if (botTurn) {
      const opp = OPPONENTS[state.opponent];
      const name = opp ? opp.en : 'Bot';
      text = state.phase === 'awaitRoll'
        ? `${who(state.current)} (${name}) is rolling…`
        : `${who(state.current)} (${name}) is thinking…`;
    }

    banner.innerHTML = text;
    action.textContent = label;
    action.onclick = handler;
    action.disabled = disabled;
    action.hidden = botTurn;

    const undo = document.getElementById('undo');
    undo.hidden = state.phase !== 'rolled' || botTurn;
    undo.disabled = state.history.length === 0;
    undo.onclick = undoMove;
  }

  // Compact stand-in for a physical bear-off tray: just the counts, not a
  // rendered stack of every borne-off checker. Doubles as the tap target for
  // bearing a checker off, same role the tray used to play.
  function renderOffStrip() {
    const row = document.getElementById('offRow');
    row.innerHTML = '';
    const canOff = state.phase === 'rolled' &&
                   typeof state.selected === 'number' &&
                   state.legal.includes('off');

    const order = shouldRotate() ? ['w', 'b'] : ['b', 'w'];
    order.forEach((color) => {
      const chip = document.createElement('button');
      chip.type = 'button';
      chip.className = `off-chip ${color}`;
      if (canOff && state.current === color) {
        chip.classList.add('legal');
        chip.addEventListener('click', () => performMove(state.selected, 'off'));
      } else {
        chip.disabled = true;
      }
      chip.innerHTML = `<span class="dot ${color}"></span>${state.off[color]} off`;
      row.appendChild(chip);
    });
  }

  // ---- Persistence ----
  // Bumping this key (rather than migrating old saves) is enough protection
  // against a future incompatible state shape; missing fields on an older
  // save degrade harmlessly since every read of them already treats
  // undefined the same as null/absent.
  const STORAGE_KEY = 'tavli-save-v1';

  function saveGame() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    } catch (e) {
      // Private browsing, storage disabled, quota exceeded, etc. — the game
      // still works, it just won't survive a refresh.
    }
  }

  function loadGame() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return;
      Object.assign(state, JSON.parse(raw));
    } catch (e) {
      return;
    }
    // Never resume mid-selection or with a stale one-shot animation flag.
    state.selected = null;
    state.legal = [];
    state.justRolled = false;
    state.justPinned = null;
  }

  // ---- Undo ----
  // A snapshot deliberately excludes `history` itself — otherwise each
  // snapshot would embed every prior snapshot, doubling in size each move.
  function snapshotState() {
    const { history, ...rest } = state;
    return JSON.parse(JSON.stringify(rest));
  }
  function pushHistory() {
    state.history.push(snapshotState());
    if (state.history.length > 20) state.history.shift();   // defensive cap; a turn is at most 4 moves
  }
  function undoMove() {
    if (state.history.length === 0) return;
    Object.assign(state, state.history.pop());
    state.selected = null;
    state.legal = [];
    state.justRolled = false;
    state.justPinned = null;
    refresh();
  }

  function refresh() {
    // Force re-entry: if the player has checkers on the bar, the bar is the only origin.
    if (state.phase === 'rolled' && state.current && state.bar[state.current] > 0) {
      state.selected = 'bar';
      state.legal = maximalDestinations('bar');
    }
    if (state.screen === 'game') {
      render();
      renderDice();
      renderOffStrip();
      renderControls();
      renderTopbar();
    }
    showScreen();
    saveGame();
    scheduleAiTurn();
  }

  // ---- AI opponents ----
  // Bots always play black. isBotTurn() is the single source of truth for
  // whether the board should be human-interactive right now; it's re-checked
  // fresh at every step rather than captured in a closure, so an undo, a
  // reload mid-turn, or leaving the screen can't leave a stale timer running
  // against a position it no longer applies to.
  const AI_DELAY_MS = 650;
  let aiTimer = null;

  function isBotTurn() {
    return state.screen === 'game' && state.opponent !== 'human' && state.current === 'b' &&
      (state.phase === 'awaitRoll' || state.phase === 'rolled');
  }

  function scheduleAiTurn() {
    if (aiTimer !== null || !isBotTurn()) return;
    aiTimer = setTimeout(() => {
      aiTimer = null;
      aiStep();
    }, AI_DELAY_MS);
  }

  // True if landing on `dest` right now would hit (Portes) or pin (Plakoto) a
  // lone enemy checker — i.e. it's already a legal destination and the point
  // currently holds exactly one opposing checker. Always false in Fevga,
  // where a single checker blocks outright and such a destination could
  // never be legal to begin with.
  function isHitMove(dest, color) {
    if (dest === 'off') return false;
    const c = state.points[dest];
    return c.color === other(color) && c.count === 1;
  }

  // How many of color's own points would be left holding exactly one checker
  // (a blot, exposed to a hit or pin) in this position. A checker just borne
  // off isn't counted — applyMoveAt already dropped it from `points`.
  function countBlots(pos, color) {
    let n = 0;
    for (let p = 1; p <= 24; p++) if (pos.points[p].color === color && pos.points[p].count === 1) n++;
    return n;
  }

  // Narrows `options` down to whichever simulated-result score is best,
  // breaking ties by keeping every option tied for best (caller still
  // chooses randomly among those).
  function bestByScore(options, color, scoreOf) {
    let best = Infinity;
    let picked = [];
    for (const [o, d] of options) {
      const clone = clonePos(state);
      applyMoveAt(clone, o, d, color);
      const score = scoreOf(clone, color);
      if (score < best) { best = score; picked = [[o, d]]; }
      else if (score === best) { picked.push([o, d]); }
    }
    return picked;
  }

  // Chooses a move for the current bot. All strategies pick uniformly at
  // random among this turn's legal, dice-maximal options, first narrowing
  // that pool per-strategy: 'hitter' to hitting/pinning moves when any is on
  // offer, 'safe' to whichever moves leave the fewest of its own blots
  // exposed afterward. OPPONENTS has room for smarter strategies to plug in
  // here later.
  function chooseAiMove() {
    const color = state.current;
    const knownMax = maxDiceUsable(state, state.dice, color);
    const origins = movableOrigins(state, color);
    const options = [];
    for (const o of origins) for (const d of maximalDestinations(o, knownMax)) options.push([o, d]);
    if (options.length === 0) return null;

    let pool = options;
    if (state.opponent === 'hitter') {
      const hits = options.filter(([, d]) => isHitMove(d, color));
      if (hits.length > 0) pool = hits;
    } else if (state.opponent === 'safe') {
      pool = bestByScore(options, color, countBlots);
    }
    return pool[Math.floor(Math.random() * pool.length)];
  }

  function aiStep() {
    if (!isBotTurn()) return;
    if (state.phase === 'awaitRoll') {
      turnRoll();
      return;
    }
    if (state.dice.length === 0 || !hasAnyLegalMove(state.current)) {
      passDevice();
      return;
    }
    const move = chooseAiMove();
    if (!move) { passDevice(); return; }   // shouldn't happen given the hasAnyLegalMove check above
    performMove(move[0], move[1]);
  }

  // ---- Actions ----
  function openingRoll() {
    const w = rollDie(), b = rollDie();
    state.opening = { w, b };
    state.justRolled = true;
    if (w === b) {
      state.openTie = true;
      state.phase = 'openRoll';
    } else {
      state.openTie = false;
      state.current = w > b ? 'w' : 'b';
      state.dice = [w, b];
      state.openingWin = true;
      state.phase = 'rolled';
      state.history = [];
      clearSelection();
    }
    refresh();
  }

  function turnRoll() {
    const a = rollDie(), b = rollDie();
    state.dice = (a === b) ? [a, a, a, a] : [a, b];
    state.justRolled = true;
    state.openingWin = false;
    state.phase = 'rolled';
    state.history = [];
    clearSelection();
    refresh();
  }

  function passDevice() {
    state.current = other(state.current);
    state.dice = [];
    state.opening = null;
    state.openTie = false;
    state.openingWin = false;
    state.phase = 'awaitRoll';
    state.history = [];
    clearSelection();
    refresh();
  }

  function endGame(winner) {
    const loser = other(winner);
    let kind = 'single', pts = 1;
    if (state.off[loser] === 0) {
      const [lo, hi] = homeRange(winner);
      let trapped = state.bar[loser] > 0;
      for (let p = lo; p <= hi && !trapped; p++) {
        if (state.points[p].color === loser || state.points[p].pinned === loser) trapped = true;
      }
      kind = trapped ? 'backgammon' : 'gammon';
      pts = trapped ? 3 : 2;
    }
    state.score[winner] += pts;
    state.result = { winner, kind, pts };
    state.phase = 'gameover';
    state.dice = [];
    clearSelection();
    refresh();
  }

  function resetRound() {
    state.phase = 'openRoll';
    state.current = null;
    state.dice = [];
    state.opening = null;
    state.openTie = false;
    state.openingWin = false;
    state.result = null;
    state.history = [];
    clearSelection();
  }

  function newGame() {          // next round, same variant, score carries over
    loadStart();
    resetRound();
    refresh();
  }

  // ---- Screens & menu ----
  function showScreen() {
    document.getElementById('menu').classList.toggle('active', state.screen === 'menu');
    document.getElementById('opponent').classList.toggle('active', state.screen === 'opponent');
    document.getElementById('game').classList.toggle('active', state.screen === 'game');
  }

  // Builds a .menu-card list from any registry shaped like VARIANTS/OPPONENTS.
  function renderPicker(listEl, registry, onPick) {
    listEl.innerHTML = '';
    for (const item of Object.values(registry)) {
      const card = document.createElement('button');
      card.className = 'menu-card';
      card.type = 'button';
      if (!item.ready) card.disabled = true;
      card.innerHTML =
        `<div class="mc-greek">${item.el}</div>` +
        `<div class="mc-body">` +
          `<div class="mc-name">${item.en}${item.ready ? '' : '<span class="soon">Soon</span>'}</div>` +
          `<div class="mc-desc">${item.desc}</div>` +
        `</div>` +
        `<div class="mc-go">›</div>`;
      if (item.ready) card.addEventListener('click', () => onPick(item.id));
      listEl.appendChild(card);
    }
  }

  function renderMenu() {
    renderPicker(document.getElementById('menuList'), VARIANTS, pickVariant);
  }

  function renderOpponentMenu() {
    const v = VARIANTS[state.pendingVariant];
    document.getElementById('opponentTitle').textContent = v ? `${v.el} · ${v.en}` : '';
    renderPicker(document.getElementById('opponentList'), OPPONENTS, (opponentId) => {
      startGame(state.pendingVariant, opponentId);
    });
  }

  function pickVariant(id) {
    state.pendingVariant = id;
    state.screen = 'opponent';
    renderOpponentMenu();
    refresh();
  }

  function startGame(id, opponent) {
    state.variant = id;
    state.opponent = opponent;
    state.score = { w: 0, b: 0 };
    loadStart();
    resetRound();
    state.screen = 'game';
    refresh();
  }

  function toMenu() {
    state.screen = 'menu';
    refresh();
  }

  function renderTopbar() {
    const v = VARIANTS[state.variant];
    document.getElementById('gameName').textContent = v ? `${v.el} · ${v.en}` : '';
    document.getElementById('score').innerHTML =
      `<span class="side"><span class="dot w"></span>${state.score.w}</span>` +
      `<span class="side"><span class="dot b"></span>${state.score.b}</span>`;
  }

  function initBuildTag() {
    const el = document.getElementById('buildTag');
    const sha = el.textContent.trim();
    // A real short SHA is 7 lowercase hex chars; the unstamped placeholder
    // (checked out straight from git, not built by the Pages workflow)
    // isn't, so this stays decoupled from the placeholder's exact spelling —
    // a sed replacement of that spelling can't accidentally match here too.
    if (/^[0-9a-f]{7,}$/.test(sha)) {
      el.href = `https://github.com/takisissaris/tavli/commit/${sha}`;
    } else {
      el.textContent = 'dev';
      el.removeAttribute('href');
    }
  }

  // ---- Init ----
  document.getElementById('toMenu').addEventListener('click', toMenu);
  document.getElementById('opponentBack').addEventListener('click', toMenu);
  renderMenu();
  loadGame();
  if (state.screen === 'opponent') renderOpponentMenu();
  refresh();
  initBuildTag();
</script>
</body>
</html>
